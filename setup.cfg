[metadata]
name = Orange3-ImageAnalytics
version = 0.13.0
author = Bioinformatics Laboratory, FRI UL
author_email = contact@orange.biolab.si

url = https://github.com/biolab/orange3-imageanalytics

project_urls =
    Bug Tracker = https://github.com/biolab/orange3-imageanalytics/issues
    Documentation = https://orange3-imageanalytics.readthedocs.io/en/latest/
    Source Code = https://github.com/biolab/orange3-imageanalytics/

documentation_name = Orange Image Analytics
description = Orange3 add-on for image data mining.
long_description = file: README.pypi
long_description_content_type= text/markdown
keywords =
    orange3 add-on
    orange3-imageanalytics
license = GPL3+
license_file = LICENSE.txt

classifiers =
    Development Status :: 1 - Planning
    Topic :: Scientific/Engineering :: Artificial Intelligence
    Intended Audience :: Education
    Intended Audience :: Science/Research
    Programming Language :: Python :: 3 :: Only
    Operating System :: OS Independent

[options]
namespace_packages = orangecontrib
zip_safe = False
include_package_data = True
packages = find_namespace:
python_requires = >=3.11
install_requires =
    AnyQt
    ndf >=0.1.4
    numpy >=1.16
    Orange3 >=3.37.0
    orange-canvas-core >=0.2.2
    orange-widget-base >=4.23.0
    pillow >=6.2.0
    requests
    requests_cache
    scipy

[options.extras_require]
test = coverage
doc =
    sphinx
    recommonmark
    sphinx_rtd_theme

[options.packages.find]
include=orangecontrib*
exclude=./*

[options.package_data]
orangecontrib.imageanalytics.widgets = icons/*.svg
orangecontrib.imageanalytics.widgets.tests = test_images/*
orangecontrib.imageanalytics.tests =
    test_images/*
    test_images/img/*
    test_images/img/inner/*

[options.entry_points]
orange3.addon =
	Orange3-Imageanalytics=orangecontrib.imageanalytics
orange.widgets =
    Image Analytics=orangecontrib.imageanalytics.widgets
orange.canvas.help =
    html-index = orangecontrib.imageanalytics.widgets:WIDGET_HELP_PATH
